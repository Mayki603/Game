<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Cat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-layer">
        <div id="start-screen">
            <h1>Lazy Cat</h1>
            <button id="start-btn">Почати гру</button>
        </div>

        <div id="stats-screen" style="display: none;">
            <h2>Результати:</h2>
            <div id="stats-list"></div>
            <button id="restart-btn">На головну</button>
        </div>

        <button id="exit-btn" style="display: none;">Закінчити гру</button>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="script.js"></script>
</body>
</html>
